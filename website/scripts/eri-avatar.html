<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .avatar {
        width: 1024px;
        height: 1024px;
        background: #0e0e13;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Funnel Display", sans-serif;
        overflow: hidden;
      }
      .word {
        font-size: 540px;
        font-weight: 700;
        color: #f4f2ea; /* airy off-white */
        letter-spacing: -0.05em;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="avatar">
      <div class="word">eri</div>
    </div>
  </body>
</html>
