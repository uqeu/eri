[package]
name = "eri-desktop"
version = "0.1.0"
edition = "2021"
description = "Eri — the floating glass companion (Tauri shell)"
default-run = "eri-desktop"

# NOTE: intentionally NOT a member of the root eri workspace (it's in the root
# Cargo.toml `exclude` list) so its heavy Tauri/wry dep tree never slows the
# `cargo test --workspace` runs. It builds from this directory on its own.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.5"
# In-process screen capture (same technique as Pluely): runs as the main "Eri"
# process, so it uses the Screen-Recording grant the user gives "Eri".
xcap = "0.0.12"
image = "0.25"

[[bin]]
name = "eri-desktop"
path = "src/main.rs"
