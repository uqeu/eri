<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body data-state="resting">
    <main class="card">
      <!-- Command bar (always visible). The whole bar is the window drag region;
           interactive controls click through. -->
      <div class="bar" data-tauri-drag-region>
        <span class="brand" data-tauri-drag-region>eri</span>
        <input
          id="q"
          class="q"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="What can I help you with today?" />
        <div class="bar-tools">
          <button id="mic" class="ico" title="Voice (⌘⇧A)" aria-label="Voice">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 1.6a1.9 1.9 0 0 0-1.9 1.9v3.9a1.9 1.9 0 1 0 3.8 0V3.5A1.9 1.9 0 0 0 8 1.6zM4.1 7.4a3.9 3.9 0 0 0 7.8 0M8 11.3v3.1M5.8 14.4h4.4" stroke="currentColor" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="shot" class="ico" title="Screenshot (⌘⇧S)" aria-label="Screenshot">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="2" y="4" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="none"/><circle cx="8" cy="8.5" r="2.2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M6 4l1-1.5h2L10 4" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
          </button>
          <button id="gear" class="ico" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2.5 5h4.5M9.5 5h4M2.5 11h7M12 11h1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8.4" cy="5" r="1.7" stroke="currentColor" stroke-width="1.3" fill="none"/><circle cx="10.6" cy="11" r="1.7" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
          </button>
          <button id="close" class="ico close" title="Hide eri (Esc) · ⌘Q to quit" aria-label="Hide">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4 6.5l4 3.5 4-3.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="send" class="send" title="Ask (Enter)" aria-label="Ask">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 13V3.5M8 3.5l-4 4M8 3.5l4 4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <!-- Answer panel (revealed once you ask) — a clean chat: your question as a
           bubble, eri's reply as plain text. -->
      <section class="panel" id="panel">
        <div class="thread" id="thread">
          <div class="msg-user" id="msgUser" hidden></div>
          <div class="answer" id="answer"></div>
          <div class="typing" id="typing" hidden>
            <span class="tword" id="typingWord">noodling</span>
            <span class="tdots"><i></i><i></i><i></i></span>
          </div>
        </div>
        <div class="panel-foot">
          <span class="status" id="status"></span>
          <button class="ghost" id="newchat">New</button>
        </div>
      </section>

      <!-- Settings panel (toggled by the gear). -->
      <section class="settings" id="settings">
        <div class="set-row">
          <div class="set-text"><div class="set-name">Appearance</div><div class="set-hint">Dark or light.</div></div>
          <div class="seg" id="themeSeg">
            <button class="seg-btn" type="button" data-theme="dark">Dark</button>
            <button class="seg-btn" type="button" data-theme="light">Light</button>
          </div>
        </div>
        <div class="set-row">
          <div class="set-text"><div class="set-name">Accent</div><div class="set-hint">Colors the logo &amp; highlights.</div></div>
          <div class="swatches" id="accentSwatches"></div>
        </div>
        <div class="set-row">
          <div class="set-text"><div class="set-name">Font</div><div class="set-hint">eri's typeface.</div></div>
          <div class="fonts" id="fontChips"></div>
        </div>
        <div class="set-row">
          <div class="set-text"><div class="set-name">Transparency</div><div class="set-hint">Slide right to fade into the screen.</div></div>
          <div class="set-slider"><input type="range" id="transparency" min="0" max="100" step="1" value="50" /><span id="transparencyVal">50%</span></div>
        </div>
        <div class="set-row">
          <div class="set-text"><div class="set-name">Invisible in screen shares</div><div class="set-hint">Hidden from recordings &amp; calls. You still see it.</div></div>
          <button class="switch" id="invisible" role="switch" aria-checked="false"></button>
        </div>
        <div class="set-row">
          <div class="set-text"><div class="set-name">Always on top</div><div class="set-hint">Float above every window.</div></div>
          <button class="switch" id="ontop" role="switch" aria-checked="false"></button>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
