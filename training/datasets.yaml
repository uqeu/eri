# eri-brain training dataset manifest
#
# THE LAW: every entry below is commercial-safe AND clean-provenance.
#   provenance: human        -> written by humans
#   provenance: open-model   -> generated by a permissively-licensed OPEN model as the original
#                               public dataset (Mixtral/DeepSeek/Qwen authors), NOT distilled by us
#                               and NOT from GPT/Claude.
# The gate is PROVENANCE, not the license tag. A dataset is rejected if it is GPT/Claude-distilled
# or NC-licensed even if nominally "open". See OFF_LIMITS at the bottom.
#
# validate.py enforces: every dataset has provenance in {human, open-model}; none collide with
# OFF_LIMITS. role is one of {chat, tools, restraint, persona, reasoning}.

datasets:
  # ---- chat / general helpfulness ----
  - name: oasst2
    hf_id: OpenAssistant/oasst2
    split: train
    license: apache-2.0
    provenance: human
    role: chat
    notes: >
      Open Assistant crowd-sourced multilingual conversation trees, human-written prompts and
      replies. Use ranked/accepted assistant messages.

  - name: dolly-15k
    hf_id: databricks/databricks-dolly-15k
    split: train
    license: cc-by-sa-3.0
    provenance: human
    role: chat
    notes: >
      15k instruction/response pairs hand-written by Databricks employees. Fully human, explicitly
      commercial-use approved.

  - name: magpie-qwen2.5-pro
    hf_id: Magpie-Align/Magpie-Qwen2.5-Pro-300K-Filtered
    split: train
    license: apache-2.0
    provenance: open-model
    role: chat
    notes: >
      Self-synthesized instruction/response pairs generated by Qwen2.5-72B-Instruct (Apache family,
      no GPT/Claude in the loop). Rows carry an {instruction, response} pair plus quality signals
      (`input_quality`, `instruct_reward`, lengths) used by the quality selector.

  # ---- tool / function calling ----
  - name: nemotron-agentic
    hf_id: nvidia/Nemotron-Agentic-v1
    split: interactive_agent
    license: cc-by-4.0
    provenance: open-model
    role: tools
    notes: >
      NVIDIA agentic tool-use trajectories generated by NVIDIA open models (Nemotron/nano). Rows
      already carry a clean `messages` list (role/content/structured tool_calls + tool replies with
      tool_call_id) plus a top-level `tools` array — near-native eri shape. NOTE: split is
      `interactive_agent` (the `tool_calling` split hits an Arrow cast bug in `datasets` 5.0.0).

  - name: xlam-function-calling-60k
    hf_id: Salesforce/xlam-function-calling-60k
    split: train
    gated: true
    license: cc-by-4.0
    provenance: open-model
    role: tools
    notes: >
      Salesforce xLAM/APIGen executable function-calling data, generated with Mixtral/DeepSeek
      (no OpenAI taint — distinct from the OFF_LIMITS APIGen-MT-5k). Verified-executable calls.

  # ---- tool-use restraint (when NOT to call a tool) ----
  - name: when2call
    hf_id: nvidia/When2Call
    split: mcq
    license: cc-by-4.0
    provenance: open-model
    role: restraint
    notes: >
      NVIDIA dataset teaching when to call vs when to answer/ask. Cuts needless tool calls 60-83%
      with no accuracy loss (arXiv 2504.18851). NOTE: there is no `train` split — use `mcq`
      (or `llm_judge`); the mcq split labels each query cannot_answer | direct | tool_call.

  - name: xlam-irrelevance-7.5k
    hf_id: MadeAgents/xlam-irrelevance-7.5k
    split: train
    license: cc-by-4.0
    provenance: open-model
    role: restraint
    notes: >
      Dedicated "do-not-call" negatives: {query, tools, answers} where `answers` is always an empty
      list — the right action is to NOT call any provided tool. Cleaner, purpose-built restraint
      signal than the irrelevance slice of xlam-60k (and not gated). Same {query,tools,answers}
      schema as xlam-60k, so it reuses the xlam converter's restraint branch.

  # ---- persona / warmth / texting register ----
  - name: synthetic-persona-chat
    hf_id: google/Synthetic-Persona-Chat
    split: train
    license: cc-by-4.0
    provenance: open-model
    role: persona
    notes: >
      Google persona-grounded chat generated by open models. Source of warm, personalized
      conversational style.

  - name: everyday-conversations
    hf_id: HuggingFaceTB/everyday-conversations-llama3.1-2k
    split: train_sft
    license: apache-2.0
    provenance: open-model
    role: persona
    notes: >
      Short everyday small-talk multi-turn chats generated by Llama-3.1 (open model). Natural,
      casual register. NOTE: split is `train_sft` (not `train`); rows carry a clean `messages` list.

  # DROPPED: bavard/personachat_truecased — ships a deprecated loading script unsupported in
  # `datasets` v5 (load fails). Synthetic-Persona-Chat covers the persona/warmth role.

  # ---- reasoning (chain-of-thought traces + final answer) ----
  - name: mixture-of-thoughts
    hf_id: open-r1/Mixture-of-Thoughts
    config: all
    split: train
    license: apache-2.0
    provenance: open-model
    role: reasoning
    notes: >
      DeepSeek-R1 reasoning traces curated by Open-R1 (R1's MIT license permits distillation of its
      outputs — no GPT/Claude). Rows carry a `messages` list whose assistant turns embed a
      <think>...</think> trace followed by the final answer. NOTE: requires a config — use `all`
      (or code|math|science); the loader reads `config` from this entry.

  - name: nemotron-post-training
    hf_id: nvidia/Nemotron-Post-Training-Dataset-v1
    split: math
    gated: true
    license: cc-by-4.0
    provenance: open-model
    role: reasoning
    notes: >
      NVIDIA post-training reasoning data generated by open models (DeepSeek-R1-0528 / Qwen3-235B).
      Rows carry a `messages` list with assistant <think> traces + a final answer (and tool_calls
      on the tool_calling split). NOTE: no `train` split — use one of
      chat|code|math|stem|tool_calling (we use `math` for the reasoning axis). Marked gated as a
      precaution: if HF terms-acceptance is required the blend's per-dataset try/except skips it
      cleanly (set HF_TOKEN + accept terms to include it). Probed accessible with the cached HF
      token; the math split streams cleanly.

# OFF_LIMITS: NEVER load any of these. GPT/Claude-distilled, or NC-licensed, or assistant turns
# of unknown/frontier provenance. validate.py FAILS if any `datasets[].hf_id` or `name` collides.
OFF_LIMITS:
  - APIGen-MT-5k            # GPT-distilled multi-turn (distinct from clean xlam-60k)
  - ToolBench               # ChatGPT-generated tool calls
  - UltraChat              # GPT-distilled
  - OpenHermes-2.5          # GPT-4 distilled
  - Orca                    # GPT-4 distilled
  - Capybara                # GPT-4 distilled
  - No-Robots               # exclude this slice of Tulu-3 / standalone (provenance restricted)
  - WildChat                # assistant turns are GPT/frontier — human user turns only, never asst
  - ShareGPT                # ChatGPT conversation dumps
  - Alpaca                  # text-davinci-003 distilled
  - Vicuna                  # ShareGPT/ChatGPT distilled
  - WizardLM                # GPT-distilled Evol-Instruct
  - SlimOrca                # GPT-4 distilled
  - lmsys-chat-1m-assistant # LMSYS assistant turns of frontier provenance (human user turns ok)
  # ---- DROPPED 2026-06-15 (audit): GPT/Claude-tainted, fragile to filter; clean replacements exist ----
  - glaive-function-calling-v2  # GPT-3.5/4 generated despite the "open" tag — replaced by nemotron-agentic
  - hermes-function-calling-v1  # GPT-4 distilled traces (Nous Hermes) — replaced by nemotron-agentic
  - tulu-3-sft-mixture          # mixed; contains GPT-distilled slices, fragile to filter cleanly -> exclude wholesale
  - ToolACE                     # disputed provenance — exclude-when-disputed
