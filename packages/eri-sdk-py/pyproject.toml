[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eri"
version = "0.1.0"
description = "Python SDK for eri — the voice-first agentic IDE that also lives in your terminal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "eri" }]
keywords = ["eri", "ai", "agent", "ide", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://tryeri.ca"
Repository = "https://github.com/eri/eri"

[tool.hatch.build.targets.wheel]
packages = ["eri"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
