[package]
name = "eri_slack"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "LicenseRef-Proprietary"
description = "Slack bot for eri — @-mention or slash-command to trigger Mercury 2 builds and Vercel deploys directly from any Slack channel."

[lints]
workspace = true

[[bin]]
name = "eri-slack"
path = "src/eri_slack.rs"

[dependencies]
anyhow.workspace = true
eri_core.workspace = true
eri_inference.workspace = true
eri_iterator.workspace = true
futures-util = "0.3"
log.workspace = true
reqwest.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
url = { workspace = true }
