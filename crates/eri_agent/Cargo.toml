[package]
name = "eri_agent"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "LicenseRef-Proprietary"
description = "Reusable, transport-agnostic building blocks of the eri agent loop (the eri-code SDK core): context compaction, permission model, output styles."

[lints]
workspace = true

[lib]
path = "src/eri_agent.rs"

[dependencies]
async-trait.workspace = true
eri_caveman = { path = "../eri_caveman" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
