[package]
name = "eri_tab"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

# Hugging Face GGUF downloader. Always on — model_store is useful even
# without inference (we can pre-cache via CLI).
hf-hub = { version = "0.5", default-features = false, features = ["tokio", "rustls-tls"] }

# === Inference backends (feature-gated, off by default) ===========
#
# Enable the `llama` feature once the workspace can resolve `cc ^1.2.61`
# alongside `llama-cpp-sys-2`. Today `tree-sitter-javascript = "0.21"` in
# `eri_index` transitively pins `cc ~1.0.90`, blocking the workspace
# resolver. To enable in-process inference:
#   1. Bump `tree-sitter-javascript` to >= 0.23 in `crates/eri_index/Cargo.toml`
#      (it switched to `cc ^1.1` from 0.23 onwards).
#   2. Add `llama-cpp-2 = { version = "0.1.146", optional = true }` below.
#   3. Wire it into the `llama` feature: `llama = ["dep:llama-cpp-2"]`.
#   4. Drop the `#[cfg(not(feature = "llama"))]` stub in `lib.rs`.
#
# The structural code (engine, model_store, dispatch) is already in place
# — only the FFI dep is missing.
#
# Optional Ollama fallback. Kept for hosts where llama.cpp can't build.
reqwest = { workspace = true, optional = true }

[features]
default = []
# Reserved: turns on the llama.cpp FFI path once the workspace `cc`
# resolver conflict is lifted. Currently a no-op because `llama-cpp-2`
# isn't declared above (see comment).
llama = []
ollama = ["dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }

[lints]
workspace = true
