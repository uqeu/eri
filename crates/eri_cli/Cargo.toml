[package]
name = "eri_cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "LicenseRef-Proprietary"
description = "Terminal-native Eri agent for interactive sessions, one-shot builds, project plans, memory, templates, and shipping workflows."

[lints]
workspace = true

[[bin]]
name = "eri"
path = "src/eri_cli.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete = "4.5"
eri_agent = { path = "../eri_agent" }
eri_apply = { path = "../eri_apply" }
eri_caveman = { path = "../eri_caveman" }
eri_core.workspace = true
eri_git = { path = "../eri_git" }
eri_hooks = { path = "../eri_hooks" }
eri_mcp = { path = "../eri_mcp" }
eri_inference.workspace = true
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = { workspace = true, features = ["json", "stream"] }
rustyline = "14"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
