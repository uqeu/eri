<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>eri Account</title>
<style>
  :root {
    color-scheme: dark;
    --bg: var(--vscode-editor-background, #181818);
    --panel: var(--vscode-sideBar-background, #1f1f1f);
    --fg: var(--vscode-foreground, #d6d6dd);
    --muted: #8b8b96;
    --border: var(--vscode-panel-border, #2a2a2a);
    --accent: var(--vscode-textLink-foreground, #228df2);
    --ok: #4ec9b0;
    --warn: #e5c07b;
    --bad: #ef4444;
    --bar-bg: rgba(255,255,255,0.06);
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--vscode-font-family, system-ui, sans-serif);
    font-size: 13px;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 20px 32px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 14px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(255,255,255,0.08);
    color: var(--fg);
  }
  .badge.tier-free       { background: rgba(255,255,255,0.06); color: var(--muted); }
  .badge.tier-starter    { background: rgba(96,165,250,0.18); color: #93c5fd; }
  .badge.tier-pro        { background: rgba(34,141,242,0.18); color: #8ec1ff; }
  .badge.tier-pro_plus   { background: rgba(245,232,103,0.18); color: #f5e867; }
  .badge.tier-teams      { background: rgba(78,201,176,0.18); color: var(--ok); }
  .badge.tier-enterprise { background: rgba(229,192,123,0.18); color: var(--warn); }
  .progress {
    position: relative;
    height: 10px;
    border-radius: 6px;
    background: var(--bar-bg);
    overflow: hidden;
    margin-top: 10px;
  }
  .progress > .fill {
    position: absolute;
    inset: 0 auto 0 0;
    background: var(--accent);
    transition: width 240ms ease;
  }
  .progress > .fill.warn { background: var(--warn); }
  .progress > .fill.bad  { background: var(--bad); }
  .progress > .ghost {
    position: absolute;
    inset: 0 auto 0 0;
    background: repeating-linear-gradient(
      45deg,
      rgba(245,232,103,0.18),
      rgba(245,232,103,0.18) 4px,
      transparent 4px,
      transparent 8px
    );
    transition: width 240ms ease;
  }
  .legend {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 12px;
  }
  button {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: white; border-color: transparent; }
  button:hover { background: rgba(255,255,255,0.05); }
  button.primary:hover { filter: brightness(1.08); }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 0;
  }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>eri Account</h1>
  <p class="muted" id="subtitle">Loading…</p>
  <div id="content"></div>
</main>
<script>
  const vscode = acquireVsCodeApi();
  const subtitle = document.getElementById("subtitle");
  const content = document.getElementById("content");

  function fmt(n) {
    if (typeof n !== "number" || !isFinite(n)) return "0";
    return n.toLocaleString("en-US");
  }

  function pct(num, denom) {
    if (!denom || denom <= 0) return 0;
    const v = (num / denom) * 100;
    if (!isFinite(v)) return 0;
    return Math.max(0, Math.min(100, v));
  }

  function fillClass(remainingPct) {
    if (remainingPct < 10) return "fill bad";
    if (remainingPct < 25) return "fill warn";
    return "fill";
  }

  function el(tag, opts) {
    const node = document.createElement(tag);
    if (opts) {
      if (opts.className) node.className = opts.className;
      if (opts.text !== undefined) node.textContent = opts.text;
      if (opts.style) {
        for (const k of Object.keys(opts.style)) node.style[k] = opts.style[k];
      }
      if (opts.attrs) {
        for (const k of Object.keys(opts.attrs)) node.setAttribute(k, opts.attrs[k]);
      }
    }
    return node;
  }

  function appendNum(parent, value, before, after) {
    if (before) parent.appendChild(document.createTextNode(before));
    parent.appendChild(el("span", { className: "num", text: fmt(value) }));
    if (after) parent.appendChild(document.createTextNode(after));
  }

  function render(state) {
    content.replaceChildren();
    if (!state.signedIn) {
      subtitle.textContent = "You're not signed in.";
      const empty = el("div", {
        className: "card empty",
        text:
          "Sign in to eri to get a monthly token budget across Claude, GPT, Gemini, and the eri Engine.",
      });
      content.appendChild(empty);
      return;
    }
    subtitle.textContent = state.email || "";

    const head = el("div", { className: "card" });
    const row = el("div", { className: "row" });
    const left = el("div");
    left.appendChild(el("div", { text: state.email || "" }));
    left.appendChild(
      el("div", {
        className: "muted",
        text: "Signed in to eri",
        style: { marginTop: "2px", fontSize: "11px" },
      }),
    );
    const badge = el("span", {
      className: "badge tier-" + (state.tierKey || "free"),
      text: state.tierLabel || "Free",
    });
    row.appendChild(left);
    row.appendChild(badge);
    head.appendChild(row);
    content.appendChild(head);

    const usage = state.usage;
    const usageCard = el("div", { className: "card" });
    const title = el("div", { className: "row" });
    title.appendChild(el("strong", { text: "Tokens this period" }));
    if (usage && usage.periodEnd) {
      let label = "";
      try {
        label = "resets " + new Date(usage.periodEnd).toLocaleDateString();
      } catch (_) {
        label = "";
      }
      title.appendChild(
        el("span", {
          className: "muted",
          text: label,
          style: { fontSize: "11px" },
        }),
      );
    }
    usageCard.appendChild(title);

    if (!usage) {
      usageCard.appendChild(
        el("div", {
          className: "muted",
          text: "Loading usage…",
          style: { marginTop: "8px", fontSize: "12px" },
        }),
      );
    } else {
      const totalCapacity = usage.tokensIncluded + usage.tokensGhost;
      const usedIncluded = Math.min(usage.tokensUsed, usage.tokensIncluded);
      const usedGhost = Math.max(0, usage.tokensUsed - usage.tokensIncluded);
      const remainingPct = pct(usage.remainingIncluded, usage.tokensIncluded);

      const progress = el("div", { className: "progress" });
      const ghostBar = el("div", { className: "ghost" });
      ghostBar.style.width = pct(usedGhost, totalCapacity) + "%";
      ghostBar.style.left = pct(usage.tokensIncluded, totalCapacity) + "%";
      const fill = el("div", { className: fillClass(remainingPct) });
      fill.style.width = pct(usedIncluded, totalCapacity) + "%";
      progress.appendChild(ghostBar);
      progress.appendChild(fill);
      usageCard.appendChild(progress);

      const numbers = el("div", { className: "legend" });
      const used = el("span");
      appendNum(used, usage.tokensUsed, "", " used / ");
      appendNum(used, usage.tokensIncluded, "", " included");
      const ghostLabel = el("span");
      ghostLabel.appendChild(document.createTextNode("ghost zone: "));
      appendNum(ghostLabel, usage.remainingGhost, "", " left");
      numbers.appendChild(used);
      numbers.appendChild(ghostLabel);
      usageCard.appendChild(numbers);

      if (usage.softCapWarning) {
        usageCard.appendChild(
          el("div", {
            text: "Soft cap reached — you're using ghost-zone tokens.",
            style: { marginTop: "10px", color: "var(--warn)", fontSize: "12px" },
          }),
        );
      }
    }

    const actions = el("div", { className: "actions" });
    const billing = el("button", { className: "primary", text: "Manage billing" });
    billing.addEventListener("click", () => vscode.postMessage({ type: "openBilling" }));
    const refresh = el("button", { text: "Refresh" });
    refresh.addEventListener("click", () => vscode.postMessage({ type: "refresh" }));
    const signOut = el("button", { text: "Sign out" });
    signOut.addEventListener("click", () => vscode.postMessage({ type: "signOut" }));
    actions.appendChild(billing);
    actions.appendChild(refresh);
    actions.appendChild(signOut);
    usageCard.appendChild(actions);

    content.appendChild(usageCard);

    // Plan picker — 4 tier cards with "Switch to this plan" buttons. Hits
    // the same /api/billing/checkout endpoint the website pricing page uses.
    content.appendChild(renderPlanPicker(state.tierKey));
  }

  function renderPlanPicker(currentTierKey) {
    const card = el("div", { className: "card" });
    card.appendChild(el("strong", { text: "Switch plan" }));
    card.appendChild(
      el("div", {
        className: "muted",
        text: "Pricing in eri's sandbox · cancel any time.",
        style: { marginTop: "2px", fontSize: "11px", marginBottom: "10px" },
      }),
    );
    const tiers = [
      {
        slug: "free",
        key: "free",
        label: "Free",
        price: "$0",
        cadence: "forever",
        bullets: ["150 Mercury turns / mo", "No frontier tokens"],
      },
      {
        slug: "starter",
        key: "starter",
        label: "Individual I",
        price: "$15",
        cadence: "/ mo",
        bullets: ["200k frontier tokens", "Cross-session memory"],
      },
      {
        slug: "pro",
        key: "pro",
        label: "Individual II",
        price: "$30",
        cadence: "/ mo",
        bullets: ["750k frontier tokens", "Multi-model + background agents"],
      },
      {
        slug: "pro_plus",
        key: "proPlus",
        label: "Individual III",
        price: "$60",
        cadence: "/ mo",
        bullets: ["4M frontier tokens", "Private brain (preview)"],
      },
    ];
    for (const t of tiers) {
      const row = el("div", {
        style: {
          display: "grid",
          gridTemplateColumns: "1fr auto",
          alignItems: "center",
          gap: "12px",
          padding: "8px 0",
          borderTop: "1px solid var(--border)",
        },
      });
      const left = el("div");
      const head = el("div");
      head.appendChild(
        el("span", {
          text: t.label + " · ",
          style: { fontWeight: "500" },
        }),
      );
      head.appendChild(
        el("span", { className: "num", text: t.price }),
      );
      head.appendChild(el("span", { className: "muted", text: " " + t.cadence }));
      left.appendChild(head);
      const sub = el("div", {
        className: "muted",
        text: t.bullets.join(" · "),
        style: { fontSize: "11px", marginTop: "2px" },
      });
      left.appendChild(sub);
      row.appendChild(left);

      const isCurrent = currentTierKey === t.key;
      const btn = el("button", {
        text: isCurrent ? "Current plan" : "Switch",
        style: isCurrent ? { opacity: "0.55", cursor: "default" } : {},
      });
      if (!isCurrent) {
        btn.addEventListener("click", () =>
          vscode.postMessage({ type: "switchPlan", slug: t.slug }),
        );
      }
      row.appendChild(btn);
      card.appendChild(row);
    }
    return card;
  }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (msg && msg.type === "state") {
      render(msg.state);
    }
  });

  vscode.postMessage({ type: "ready" });
</script>
</body>
</html>
